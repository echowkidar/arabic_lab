server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite Frontend SPA Assets (Content-hashed, immutable)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite Frontend SPA (Never cache index.html to prevent stale app bundle mismatches)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://arabic_lab_server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO Real-time Signaling Engine
    location /socket.io/ {
        proxy_pass http://arabic_lab_server:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Audio & Screen Recordings
    location /uploads/ {
        proxy_pass http://arabic_lab_server:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static Downloads (Installer & setups)
    location /downloads/ {
        proxy_pass http://arabic_lab_server:5000/downloads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
