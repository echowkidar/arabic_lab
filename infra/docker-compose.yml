version: '3.8'

services:
  # 1. PostgreSQL (Users, Sessions, Call Logs, Recordings Metadata)
  postgres:
    image: postgres:16-alpine
    container_name: arabic_lab_postgres
    restart: always
    environment:
      POSTGRES_USER: arabiclab
      POSTGRES_PASSWORD: LabSecurePassword2026!
      POSTGRES_DB: arabic_lab_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lab_network

  # 2. Redis (Presence, Pub/Sub, Live Sessions)
  redis:
    image: redis:7-alpine
    container_name: arabic_lab_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - lab_network

  # 3. MinIO (On-Premises S3 Storage for Session Recordings)
  minio:
    image: minio/minio:latest
    container_name: arabic_lab_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arabiclabadmin
      MINIO_ROOT_PASSWORD: MinioSecurePassword2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - lab_network

  # 4. LiveKit SFU (Ultra-Low Latency Real-Time Audio, Video & Screen Sharing)
  livekit:
    image: livekit/livekit-server:v1.7
    container_name: arabic_lab_livekit
    restart: always
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"         # WebRTC Signaling HTTP/WebSocket
      - "7881:7881"         # TCP fallback
      - "50000-50050:50000-50050/udp" # WebRTC media over LAN
    networks:
      - lab_network

  # 5. Coturn (TURN/STUN Server for LAN / NAT Fallback)
  coturn:
    image: coturn/coturn:latest
    container_name: arabic_lab_coturn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    networks:
      - lab_network

  # 6. Backend API & WebRTC Signaling Server
  api-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: arabic_lab_api
    restart: always
    depends_on:
      - postgres
      - redis
      - livekit
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://arabiclab:LabSecurePassword2026!@postgres:5432/arabic_lab_db?schema=public
      JWT_SECRET: arabic_lab_super_secret_jwt_key_2026
      CLIENT_ORIGIN: "*"
    ports:
      - "5000:5000"
    networks:
      - lab_network

  # 7. Nginx Reverse Proxy (Frontend UI + WebSocket + WebRTC Relay)
  nginx:
    image: nginx:alpine
    container_name: arabic_lab_nginx
    restart: always
    depends_on:
      - api-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../client/dist:/usr/share/nginx/html:ro
    networks:
      - lab_network

networks:
  lab_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
